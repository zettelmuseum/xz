name: Build XZ 5.8.4 ARM64 Static

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Checkout XZ 5.8.4
        uses: actions/checkout@v4
        with:
          repository: tukaani-project/xz
          ref: v5.8.4
          path: xz

      - name: Install autotools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            gettext \
            autopoint \
            pkg-config

      - name: Generate configure
        working-directory: xz
        run: |
          ./autogen.sh --no-po4a

      - name: Configure
        working-directory: xz
        env:
          CC: zig cc -target aarch64-linux-musl
          AR: zig ar
          RANLIB: zig ranlib
        run: |
          ./configure \
            --host=aarch64-linux-musl \
            --build=x86_64-pc-linux-gnu \
            --prefix=/usr \
            --disable-shared \
            --enable-static \
            --disable-xzdec \
            --disable-lzmadec \
            --disable-lzmainfo \
            --disable-scripts \
            --disable-doc \
            --disable-nls \
            --disable-symbol-versions \
            CFLAGS="-O2 -ffunction-sections -fdata-sections -fPIE" \
            LDFLAGS="-static-pie -Wl,--gc-sections -Wl,--strip-all"

      - name: Build
        working-directory: xz
        run: |
          make -j"$(nproc)"

      - name: Verify static ELF
        working-directory: xz
        run: |
          set -eux

          FILE="src/xz/xz"

          echo "===== FILE ====="
          file "$FILE"

          echo "===== ELF TYPE ====="
          readelf -h "$FILE" | grep -E 'Class|Machine|Type'

          echo "===== DYNAMIC SECTION ====="
          readelf -d "$FILE" || true

          echo "===== INTERPRETER ====="
          if readelf -l "$FILE" | grep -q 'INTERP'; then
            echo "ERROR: PT_INTERP vorhanden"
            exit 1
          fi

          echo "===== DYNAMIC DEPENDENCIES ====="
          if readelf -d "$FILE" 2>/dev/null | grep -q 'NEEDED'; then
            echo "ERROR: DT_NEEDED vorhanden"
            exit 1
          fi

          echo "===== XZ VERSION ====="
          "$FILE" --version

          echo "===== STATIC BUILD OK ====="
          echo "Keine DT_NEEDED-Abhängigkeiten."
          echo "Kein PT_INTERP vorhanden."

      - name: Package
        run: |
          mkdir -p release

          cp xz/src/xz/xz \
            release/xz-5.8.4-aarch64-static

          chmod 755 release/xz-5.8.4-aarch64-static

          tar -czf \
            xz-5.8.4-aarch64-static.tar.gz \
            -C release \
            xz-5.8.4-aarch64-static

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xz-5.8.4-aarch64-static
          path: |
            xz-5.8.4-aarch64-static.tar.gz
            release/xz-5.8.4-aarch64-static
